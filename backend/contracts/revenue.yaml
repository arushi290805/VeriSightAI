name: revenue
definition: "Daily gross revenue by region and product"
calculation: "SUM(order_value) WHERE status = 'completed'"
grain: daily
refresh_cadence: daily
drivers: [price, volume, mix, region, product]
thresholds:
  z_score_alert: 2.5
  z_score_high_confidence: 3.0
lineage_source: "synthetic_erp_export.csv"
access_roles: [cfo, regional_manager]
